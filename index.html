<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking de Brawlers</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#080c16;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:#0d1424;
    padding:15px 10px;
    text-align:center;
    border-bottom:1px solid #263451;
}

h1{
    margin:0;
    font-size:22px;
}

.sub{
    color:#8995ad;
    font-size:12px;
    margin-top:5px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.tab{
    flex:1;
    padding:11px;
    border:1px solid #34415d;
    border-radius:12px;
    background:#182239;
    color:white;
    font-weight:bold;
}

.tab.active{
    background:#ffd43b;
    color:#111;
}

.toolbar{
    display:flex;
    gap:8px;
    padding:10px;
    flex-wrap:wrap;
}

input{
    flex:1;
    min-width:180px;
    padding:11px;
    border-radius:10px;
    border:1px solid #34415d;
    background:#101827;
    color:white;
}

button{
    cursor:pointer;
}

.action{
    background:#182239;
    color:white;
    border:1px solid #34415d;
    border-radius:10px;
    padding:10px;
    font-weight:bold;
}

.status{
    padding:0 10px 10px;
    color:#9ba6bb;
    font-size:12px;
}

.status b{
    color:#4de184;
}

.page{
    display:none;
    padding:0 10px 30px;
}

.page.active{
    display:block;
}

.pool{
    border:1px dashed #405071;
    border-radius:15px;
    padding:12px;
    margin-bottom:12px;
}

.poolTitle{
    font-weight:bold;
    margin-bottom:9px;
}

.poolCards{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.bucket{
    background:#111a2d;
    border:1px solid #293957;
    border-radius:14px;
    min-height:170px;
    padding:9px;
}

.bucket.over{
    border-color:#ffd43b;
}

.bucketHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.trophy{
    font-size:18px;
    font-weight:bold;
}

.count{
    background:#080e1b;
    padding:4px 7px;
    border-radius:20px;
    color:#9ca8bd;
    font-size:11px;
}

.drop{
    min-height:120px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.card{
    background:linear-gradient(145deg,#293958,#172238);
    border:1px solid #3b4d70;
    border-radius:9px;
    padding:9px 7px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

.card.selected{
    outline:2px solid #ffd43b;
}

.empty{
    color:#59667e;
    text-align:center;
    font-size:11px;
    padding:15px 3px;
}

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:flex-end;
    z-index:50;
}

.modal.show{
    display:flex;
}

.sheet{
    width:100%;
    background:#111a2d;
    border-radius:20px 20px 0 0;
    padding:16px;
}

.sheet h2{
    margin:0;
    font-size:18px;
}

.sheet p{
    color:#8995ad;
    font-size:12px;
}

.choices{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.choice{
    background:#1c2942;
    color:white;
    border:1px solid #3a4b6b;
    border-radius:10px;
    padding:11px 4px;
    font-weight:bold;
}

.cancel{
    width:100%;
    margin-top:10px;
    background:#301922;
    color:white;
    border:1px solid #633442;
    border-radius:10px;
    padding:11px;
}

.toast{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    color:#111;
    padding:10px 15px;
    border-radius:12px;
    font-size:12px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:100;
}

.toast.show{
    opacity:1;
}

@media(max-width:380px){
    .grid{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<header>

<h1>🏆 Ranking de Brawlers</h1>

<div class="sub">
107 brawlers • atualizado até Cosmo
</div>

<div class="tabs">

<button class="tab active" onclick="changePage('low',this)">
100 → 1000
</button>

<button class="tab" onclick="changePage('high',this)">
1000 → 2000
</button>

</div>

</header>

<div class="toolbar">

<input
id="search"
type="search"
placeholder="🔎 Procurar brawler..."
oninput="render()">

<button class="action" onclick="clearSearch()">
Limpar
</button>

<button class="action" onclick="resetAll()">
↻ Zerar
</button>

</div>

<div class="status" id="status"></div>

<!-- PÁGINA 100-1000 -->

<div id="low" class="page active">

<div class="pool">

<div class="poolTitle">
📦 Brawlers não classificados
</div>

<div id="poolLow" class="poolCards"></div>

</div>

<div id="gridLow" class="grid"></div>

</div>

<!-- PÁGINA 1000-2000 -->

<div id="high" class="page">

<div class="pool">

<div class="poolTitle">
📦 Brawlers não classificados
</div>

<div id="poolHigh" class="poolCards"></div>

</div>

<div id="gridHigh" class="grid"></div>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="sheet">

<h2 id="modalName">
Brawler
</h2>

<p>
Escolha quantos troféus você possui nesse brawler.
</p>

<div id="choices" class="choices"></div>

<button class="cancel" onclick="closeModal()">
Cancelar
</button>

</div>

</div>

<div id="toast" class="toast">
Salvo automaticamente ✓
</div>


<script>

/* =========================
   LISTA DE BRAWLERS
========================= */

const brawlers = [
"8-Bit",

"Emz",
"Gene",
"Gray",
"Griff",
"Leon",
"Lou",
"Meeple",
"Mina",
"Mortis",
"Otis",
"Pearl",
"Pierce",
"Piper",
"Ruffs",
"Shade",
"Alli",
"Belle",
"Bibi",
"Bull",
"Charlie",
"Chester",
"Fang",
"Finx",
"Gus",
"Kaze",
"Kenji",
"Kit",
"Lily",
"Mandy",

"Moe",
"Najia",
"Nani",
"Nita",
"Penny",
"Poco",
"Sirius",
"Spike",
"Sprout",
"Tara",
"Amber",
"Barley",
"Buster",
"Buzz",
"Colette",
"Darryl",
"Draco",
"Frank",
"Gale",
"Gigi",
"Glowy",
"Jae-Yong",
"Juju",
"Lola",
"Melodie",
"R-T",
"Trunk",
"Bea",
"Berry",
"Bonnie",

"Dynamike",
"Eve",
"Hank",
"Janet",
"Jessie",
"Larry & Lawrie",
"Mico",
"Ollie",
"Rosa",
"Sandy",
"Shelly",
"Squeak",
"Willow",
"Ziggy",
"Chuck",
"Clancy",
"El Primo",
"Grom",
"Jacky",
"Mr. P",
"Pam",
"Sam",
"Tick",
"Cosmo"
];


/* =========================
   TROFÉUS
========================= */

const lowTrophies = [
100,200,300,400,500,
600,700,800,900,1000
];

const highTrophies = [
1000,1100,1200,1300,1400,
1500,1600,1700,1800,1900,2000
];


/* =========================
   SALVAMENTO
========================= */

const STORAGE_KEY =
"ranking_brawlers_cosmo";

let data =
JSON.parse(localStorage.getItem(STORAGE_KEY));

if(!data){

    data = {};

    brawlers.forEach(name=>{
        data[name] = null;
    });

}


/* =========================
   VARIÁVEIS
========================= */

let selectedBrawler = null;


/* =========================
   SALVAR
========================= */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

    updateStatus();

}


/* =========================
   STATUS
========================= */

function updateStatus(){

    let classified =
    Object.values(data)
    .filter(x=>x !== null)
    .length;

    let trophies =
    Object.values(data)
    .reduce((total,x)=>{
        return total + (x || 0);
    },0);

    document.getElementById("status").innerHTML =
    `<b>${classified}/${brawlers.length}</b>
    classificados •
    <b>${trophies.toLocaleString("pt-BR")}</b>
    troféus totais •
    💾 salvamento automático`;

}


/* =========================
   CRIAR CARD
========================= */

function createCard(name){

    const card =
    document.createElement("div");

    card.className = "card";

    card.textContent = name;

    card.onclick = ()=>{
        openModal(name);
    };

    card.draggable = true;

    card.ondragstart = event=>{
        event.dataTransfer.setData(
            "text/plain",
            name
        );
    };

    return card;

}


/* =========================
   RENDERIZAR
========================= */

function render(){

    const search =
    document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();


    /* POOL */

    const poolLow =
    document.getElementById("poolLow");

    const poolHigh =
    document.getElementById("poolHigh");

    poolLow.innerHTML = "";
    poolHigh.innerHTML = "";


    brawlers
    .filter(name =>
        data[name] === null &&
        name.toLowerCase().includes(search)
    )
    .forEach(name=>{

        poolLow.appendChild(
            createCard(name)
        );

        poolHigh.appendChild(
            createCard(name)
        );

    });


    /* GRADES */

    createGrid(
        "gridLow",
        lowTrophies
    );

    createGrid(
        "gridHigh",
        highTrophies
    );


    updateStatus();

}


/* =========================
   CRIAR GRADE
========================= */

function createGrid(id,trophies){

    const grid =
    document.getElementById(id);

    grid.innerHTML = "";


    trophies.forEach(trophy=>{

        const bucket =
        document.createElement("div");

        bucket.className =
        "bucket";


        bucket.innerHTML = `

        <div class="bucketHeader">

            <span class="trophy">
                🏆 ${trophy}
            </span>

            <span class="count">
                0
            </span>

        </div>

        <div class="drop"></div>

        `;


        const drop =
        bucket.querySelector(".drop");


        /* DRAG */

        bucket.ondragover =
        event=>{

            event.preventDefault();

            bucket.classList.add(
                "over"
            );

        };


        bucket.ondragleave =
        ()=>{
            bucket.classList.remove(
                "over"
            );
        };


        bucket.ondrop =
        event=>{

            event.preventDefault();

            bucket.classList.remove(
                "over"
            );

            const name =
            event.dataTransfer
            .getData("text/plain");

            if(name){

                assign(
                    name,
                    trophy
                );

            }

        };


        /* BRAWLERS NESSA FAIXA */

        const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


        const names =
        brawlers.filter(name=>
            data[name] === trophy &&
            name.toLowerCase()
            .includes(search)
        );


        names.forEach(name=>{

            drop.appendChild(
                createCard(name)
            );

        });


        bucket.querySelector(
            ".count"
        ).textContent =
        brawlers.filter(
            name=>data[name] === trophy
        ).length;


        if(names.length === 0){

            drop.innerHTML =
            `<div class="empty">
                Arraste aqui
            </div>`;

        }


        grid.appendChild(bucket);

    });

}


/* =========================
   ATRIBUIR TROFÉUS
========================= */

function assign(name,trophy){

    data[name] = trophy;

    save();

    render();

    showToast(
        `${name} → ${trophy} troféus`
    );

}


/* =========================
   MODAL
========================= */

function openModal(name){

    selectedBrawler = name;

    document.getElementById(
        "modalName"
    ).textContent = name;


    const choices =
    document.getElementById(
        "choices"
    );

    choices.innerHTML = "";


    const all =
    [...new Set([
        ...lowTrophies,
        ...highTrophies
    ])];


    all.forEach(trophy=>{

        const button =
        document.createElement("button");

        button.className =
        "choice";

        button.textContent =
        `🏆 ${trophy}`;


        button.onclick = ()=>{

            assign(
                selectedBrawler,
                trophy
            );

            closeModal();

        };


        choices.appendChild(
            button
        );

    });


    const remove =
    document.createElement("button");

    remove.className =
    "choice";

    remove.textContent =
    "❌ Não classificado";


    remove.onclick = ()=>{

        data[selectedBrawler] =
        null;

        save();

        render();

        closeModal();

    };


    choices.appendChild(
        remove
    );


    document
    .getElementById("modal")
    .classList.add("show");

}


function closeModal(){

    document
    .getElementById("modal")
    .classList.remove("show");

    selectedBrawler = null;

}


/* =========================
   TROCAR PÁGINA
========================= */

function changePage(page,button){

    document
    .querySelectorAll(".page")
    .forEach(p=>{
        p.classList.remove("active");
    });


    document
    .getElementById(page)
    .classList.add("active");


    document
    .querySelectorAll(".tab")
    .forEach(t=>{
        t.classList.remove("active");
    });


    button.classList.add("active");

}


/* =========================
   BUSCA
========================= */

function clearSearch(){

    document
    .getElementById("search")
    .value = "";

    render();

}


/* =========================
   RESET
========================= */

function resetAll(){

    if(!confirm(
        "Tem certeza que quer apagar toda a classificação?"
    )){
        return;
    }


    brawlers.forEach(name=>{
        data[name] = null;
    });


    save();

    render();

    showToast(
        "Tudo foi zerado"
    );

}


/* =========================
   TOAST
========================= */

function showToast(text){

    const toast =
    document.getElementById(
        "toast"
    );

    toast.textContent = text;

    toast.classList.add("show");


    setTimeout(()=>{
        toast.classList.remove(
            "show"
        );
    },1400);

}


/* =========================
   FECHAR MODAL
========================= */

document
.getElementById("modal"
.addEventListener("click",event=>{

    if(
        event.target.id === "modal"
    )q{
        closeModal();
    }

});


/* =========================
   INICIAR
========================= */

render();

</script>

</body>
  </html>
